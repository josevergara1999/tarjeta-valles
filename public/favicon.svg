<!--
  ICONO PROVISIONAL — NO ES DISEÑO, ES UN MARCADOR DE POSICIÓN.

  Acordado con José el 30-ago-2026: este icono lo hace Claude Code y se reemplaza más adelante. Es la
  excepción, no la regla. Todo lo demás que sea diseño se avisa y lo hace José en Claude Design; acá
  se implementa recién cuando lo entrega. Ver CLAUDE.md.

  Existe para que la PWA sea instalable hoy: sin iconos de 192 y 512 px Android no ofrece instalarla,
  y ese bloqueo iba a aparecer tarde, con la app ya avanzada.

  Es deliberadamente lo más neutro posible. El fondo es el `background_color` que ya estaba decidido
  en el manifiesto (#0b0b0b) y encima va un monograma. No propone identidad ni paleta.

  PARA REEMPLAZARLO cuando llegue el logo real:
    1. Sobrescribir ESTE archivo con el logo (SVG cuadrado, o un PNG de 512x512 o más).
    2. npm run iconos
  Eso regenera los seis archivos de public/. No hay que tocar vite.config.js ni index.html.

  El texto va con la línea base calculada a mano y no con `dominant-baseline`, porque el rasterizador
  que usa el generador no aplica esa propiedad y el monograma queda descentrado hacia arriba.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0b0b0b"/>
  <text x="256" y="319"
        font-family="Helvetica, Arial, sans-serif"
        font-size="176"
        font-weight="600"
        letter-spacing="4"
        fill="#f5f5f5"
        text-anchor="middle">TV</text>
</svg>
